<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Сколько корней?</title>
<style>
:root{color-scheme:dark;--bg:#0a1a38;--card:#10284f;--tx:#e8f0ff;--mut:#9db4d8;--pr:#3b82f6;--pl:#1c3a6b;--or:#e8590c;--ok:#2b9348;--no:#d62828;--bd:#28487d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:linear-gradient(160deg,#081530,#0d2b5c) fixed;min-height:100vh}
.prof{display:flex;gap:14px;align-items:center;cursor:pointer}
.ava{font-size:34px;width:60px;height:60px;border-radius:50%;background:var(--pl);display:grid;place-items:center;flex:none}
.lb{display:grid;grid-template-columns:44px 1fr auto 56px;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bd)}
.avs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.avs button{padding:8px 10px;font-size:20px}
input{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
h1,.stages,.meta,.sub{position:relative}
#app{max-width:680px;margin:0 auto;padding:16px}
h1{color:#8ec5ff;text-align:center;margin:8px 0 4px;font-size:30px;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.sub{color:var(--mut);text-align:center;margin:0 0 8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;color:#fff;background:var(--pr)}
button.or{background:var(--or);font-weight:600}
button.gh{background:var(--pl);color:var(--tx)}
button:disabled{opacity:.9;cursor:default}
.modes{display:grid;gap:12px}
.modes button{text-align:left;padding:16px}
.modes small{display:block;font-weight:400;opacity:.9}
.stages{display:flex;justify-content:center;gap:22px;margin:6px 0 10px}
.dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--bd);color:var(--mut);background:var(--card)}
.dot.on{background:var(--or);color:#fff;border-color:var(--or);box-shadow:0 0 0 5px rgba(232,89,12,.25),0 0 18px var(--or)}
.dot.done{background:var(--pr);color:#fff;border-color:var(--pr)}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
.eq{font-size:30px;text-align:center;padding:22px 6px;font-weight:600;overflow-x:auto;white-space:nowrap}
.ans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ans button{font-size:20px;padding:16px 4px}
.ans button.right{background:var(--ok)}.ans button.wrong{background:var(--no)}.ans button.sel{outline:3px solid var(--or);outline-offset:2px}
.fb{border-left:5px solid var(--no);padding:8px 12px;margin-top:12px}
.fb.good{border-color:var(--ok)}
.fb p{margin:4px 0}
svg{display:block;margin:8px auto;max-width:100%;background:var(--bg);border-radius:10px}
.cheat{background:var(--pl);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:15px}
.cheat li{margin:3px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:12px}
.big{font-size:44px;font-weight:800;color:var(--pr);text-align:center}
.tbl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tbl div{background:var(--pl);border-radius:10px;padding:8px}
.topics{display:grid;gap:8px}
.topics button{text-align:left;background:var(--pl);color:var(--tx);border:2px solid transparent}
.topics button.hard{border-color:var(--or)}
.topics button.sel{border-color:var(--pr)}
</style>

<script>

const FB_CONFIG={apiKey:"AIzaSyBIBVayqSyh5vi-_LBNVYrI5qUwZefniTI",authDomain:"korni-game.firebaseapp.com",projectId:"korni-game",appId:"1:603519712372:web:a2b464642eee1c191ea521"};
const $=s=>document.querySelector(s);
const rn=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rn(0,a.length-1)];
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const M='−';
const n2=v=>(v<0?M:'')+Math.abs(v);
const CAT={signs:'Знаки a и c',cmp:'Сравнение b² и 4ac',sq:'Полный квадрат'};
const REF={
signs:{t:'Разные знаки a и c',b:['Если a и c <b>разные знаки</b>, то произведение ac &lt; 0, значит −4ac &gt; 0 и D = b² − 4ac &gt; 0.','Результат: всегда <b>2 корня</b>, какой бы ни был b (даже если b нет).','Пример: 2x² + 5x − 3 = 0. a = 2, c = −3, знаки разные → 2 корня.','Ловушка: смотри знаки у a и c после переноса всех членов в одну часть!']},
cmp:{t:'Одинаковые знаки: сравниваем b² и 4ac',b:['Если a и c <b>одного знака</b>, всё решает сравнение b² и 4ac.','b² &gt; 4ac → <b>2 корня</b>. b² &lt; 4ac → <b>0 корней</b>.','Если члена с x нет (b = 0), то b² = 0 &lt; 4ac → <b>0 корней</b>.','Пример: x² + 3x + 5 = 0: b² = 9, 4ac = 20, 9 &lt; 20 → 0 корней.']},
sq:{t:'Полный квадрат',b:['Если b² = 4ac, то D = 0 и уравнение сворачивается по формуле (kx ± m)².','Результат: ровно <b>1 корень</b>.','Пример: x² + 6x + 9 = (x + 3)², b² = 36 = 4·1·9 → 1 корень.','Совет: проверь, что a и c — полные квадраты (или оба кратны одному числу), а b = 2·k·m.']}};
let mode,stage,idx,qs,score,stats,sSc,cur,done,showCheat;

function poly(a,b,c){let s='';[[a,'x²'],[b,'x'],[c,'']].forEach(([v,x])=>{if(!v)return;const ab=Math.abs(v),co=(ab===1&&x)?'':ab;
 s+=s?(v<0?' − ':' + '):(v<0?M:'');s+=co+x;});return s||'0';}

function examForm(a,b,c,adv,st,mix){
 const std=poly(a,b,c)+' = 0';
 if(Math.random()>=((mix||adv)?.5:.35))return std;
 const opts=[];
 if(c)opts.push(()=>poly(a,b,0)+' = '+n2(-c));
 if(b)opts.push(()=>poly(a,0,c)+' = '+poly(0,-b,0));
 if(b&&c)opts.push(()=>poly(a,0,0)+' = '+poly(0,-b,-c));
 return opts.length?pick(opts)():std;
}
function gen(type,adv,st,mix){
 const Mx=adv?Math.min(8,3+st):2+st, sg=(adv||st>1)?pick([1,-1]):1;
 let a,b,c,cat,form='';
 const same=()=>{a=sg*rn(1,Mx);c=sg*rn(1,Mx)};
 if(type==='signs'){a=sg*rn(1,Mx);c=-sg*rn(1,Mx);b=rn(-Mx,Mx);cat='signs';}
 else if(type==='nob'){same();b=0;cat='cmp';}
 else if(type==='sq'){const nn=1;let k,m;do{k=rn(1,adv?3:2);m=rn(1,3)}while(k*m>6);
  a=sg*nn*k*k;c=sg*nn*m*m;b=sg*pick([1,-1])*2*nn*k*m;cat='sq';
  form=(sg<0?M:'')+(nn>1?nn:'')+'('+(k>1?k:'')+'x '+(b*sg<0?'−':'+')+' '+m+')²';}
 else{same();const r=Math.round(Math.sqrt(4*a*c)),lo=adv?Math.max(1,r-3):1,hi=adv?r+3:r+4,cs=[];
  for(let v=lo;v<=hi;v++){const g=v*v>4*a*c,l=v*v<4*a*c;if(type==='gt'?g:l)cs.push(v);}
  const cc=cs.filter(v=>v<=(adv?14:12));b=pick(cc.length?cc:cs)*pick([1,-1]);cat='cmp';}
 let shown=examForm(a,b,c,adv,st,mix);
 const D=b*b-4*a*c;
 return{a,b,c,cat,form,shown,norm:poly(a,b,c)+' = 0',r:D>0?2:D===0?1:0,type};
}
function makeStage(){
 const t=shuf(['signs','signs','gt','lt','sq','nob',pick(['sq','gt','signs','lt'])]);
 qs=t.map(x=>mode==='rate'?genRate(x,stage):gen(x,false,stage+1,mode==='adv'));
}

function saveRes(){if(savedFlag)return;savedFlag=true;const p=loadP();if(mode==='rate'){const r=loadR(),n=p.name||'Игрок',e=r[n]||{pts:0};e.pts+=score;e.a=p.ava||'🙂';r[n]=e;saveR(r);}else addBoard(p);p.games=(p.games||0)+1;p[mode]=Math.max(p[mode]||0,score);p.hist=(p.hist||[]).concat({m:mode,s:score,d:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}).slice(-5);saveP(p);}

function myPts(){const n=loadP().name||'Игрок';return (loadR()[n]||{}).pts||0;}

function genRate(x,s){const tier=Math.floor(myPts()/200);return tier===0?gen(x,false,s+1):gen(x,true,Math.min(12,s+1+2*(tier-1)),true);}
function diaryR(){const t=myPts(),lv=Math.floor(t/200);
 $('#app').innerHTML=`<h1>ДНЕВНИК</h1><p class='sub'>🏆 Рейтинговый режим</p>

 <div class='card'><div class='tbl'><div><div class='sub'>Всего очков</div><b>${t}</b></div><div><div class='sub'>Уровень</div><b>${lv+1}</b></div><div><div class='sub'>До след. уровня</div><b>${(lv+1)*200-t}</b></div></div><p class='sub' style='margin-top:10px'>${t>=21?'Ты в таблице лидеров! 🏆':'До таблицы лидеров: '+(21-t)+' очков'}</p></div>

 const tab=(k,l)=>`<button class='${m===k?'or':'gh'}' data-m='${k}' onclick='board(this.dataset.m)'>${l}</button>`,md=['🥇','🥈','🥉'];let body;
 if(m==='rate'){const rows=Object.entries(loadR()).filter(([n,e])=>e.pts>=21).sort((x,y)=>y[1].pts-x[1].pts).slice(0,100),t=myPts();
